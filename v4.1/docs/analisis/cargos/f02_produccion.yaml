- id: 13
  dashboard: Sala de control
  proposito: Vigila los procesos continuos desde los paneles. Reconoce alarmas, sigue tendencias y coordina la respuesta del personal en campo.
  jornada:
    inicio: Recibe el traspaso de la sala (alarmas abiertas, equipos en mantención) y revisa las tendencias de las últimas horas.
    durante: Sigue tendencias y alarmas, reconoce las que corresponden y registra eventos en la bitácora de proceso.
    coordina: Con operación de campo, automatización y supervisión.
    anomalia: Ante una alarma crítica, la reconoce, avisa al operador de campo o a mantenimiento y registra la respuesta.
    cierre: Entrega la bitácora de proceso con alarmas abiertas y pendientes.
  decide: Reconocer alarmas y ejecutar secuencias autorizadas.
  escala: Supervisor de turno, automatización (falla de control o de comunicación).
  consulta: [Estados de equipos y PLC, Tendencias de variables, Alarmas abiertas y su historial, Eventos de planta, OT abiertas]
  genera:
    registrar: Reconocimiento de alarmas y bitácora de proceso.
    crear: Avisos de falla.
  no_ve: Programas PLC en edición, datos de personas, sueldos. No cambia parámetros de proceso fuera de lo autorizado.
  impacto: Un reconocimiento tardío convierte un aviso en una detención. Su bitácora explica qué pasó cuando automatización o mantenimiento investigan.
  ui:
    prioridad: Alarmas críticas abiertas y variables fuera de rango.
    disposicion: Consola de alarmas en vivo · mapa de planta · tendencias seleccionables · bitácora de proceso.
    menu: [Sala de control, Alertas, Explorador de planta, Bitácora, Reportar falla, Seguridad]
    datos: "Tablas: alarmas con nivel, equipo y tiempo abierto. Formularios: reconocimiento con comentario, entrada de bitácora."
    acciones: [Reconocer alarma, Registrar en bitácora, Reportar falla]
    alertas: [Alarma crítica sin reconocer, PLC sin comunicación, Alarma recurrente]
    notificaciones: Mantenimiento tomó una OT de un equipo en alarma.
    vacio: “No hay alarmas abiertas.”
    componentes: Consola de eventos con filtro por nivel y marca de datos simulados, gráficos de tendencia.
  medir:
    - [Estabilidad del proceso, Lecturas de sensores (variabilidad), hoy]
    - [Alarmas recurrentes, Historial de alarmas por equipo, hoy]
    - [Disponibilidad, Cambios de estado de equipos, hoy]
  flujo:
    entrada: Telemetría, alarmas y eventos de PLC.
    procesa: Reconoce, interpreta y coordina.
    salida: Alarmas reconocidas, bitácora de proceso, avisos de falla.
    destinatarios: Operación de campo, mantenimiento, automatización, supervisión.
    consecuencia: Mantenimiento recibe el aviso con el contexto de la alarma.
  permisos: {eventos: "c,r@pl", equipos: "c@pl", plc: "c@pl", ot: "c,cr@pl", traspaso: "c,cr@ar", rutinas: "c,r@pr", sst: "r@pr", habilitaciones: "c@pr"}
  apps: [desktop]
  validar: [Si la sala de control puede ejecutar mandos a distancia (hoy no), Qué alarmas puede reconocer y cuáles solo automatización]
  hoy: Ajuste por cargo en Desktop (inicio de sala de control). El reconocimiento de alarmas existe. No hay bitácora de proceso propia.

- id: 14
  dashboard: Mis movimientos
  proposito: Mueve materiales por rutas autorizadas con un equipo inspeccionado. Es un cargo de alto riesgo, así que la habilitación y el checklist preuso son obligatorios.
  jornada:
    inicio: Confirma su habilitación de grúa horquilla y completa la inspección preuso del equipo.
    durante: Recibe tareas de traslado, mueve cargas dentro de la capacidad y registra cada movimiento (origen, destino, carga).
    coordina: Con bodega, despacho, recepción y seguridad.
    anomalia: Si detecta un daño en el equipo, una ruta bloqueada o un incidente, detiene, reporta y no opera hasta que se libere.
    cierre: Deja el equipo estacionado y el registro de movimientos completo.
  decide: No operar si el checklist preuso falla o la habilitación está vencida.
  escala: Jefe de bodega, prevención (incidentes).
  consulta: [Su habilitación, Tareas de traslado, Ubicaciones, Capacidad del equipo]
  genera:
    registrar: Checklist preuso, movimientos de carga, daños e incidentes.
  no_ve: Información de otras personas, sueldos, contratos.
  impacto: Un movimiento no registrado descuadra el inventario; un equipo sin inspección es un riesgo grave para las personas.
  ui:
    prioridad: Estado de su habilitación, checklist del día y tareas de traslado pendientes.
    disposicion: Habilitación y checklist · lista de tareas de traslado · registro rápido de movimiento.
    menu: [Mis movimientos, Checklist preuso, Seguridad, Reportar, Mi cargo]
    datos: "Formularios: checklist preuso, movimiento (origen, destino, carga), daño o incidente."
    acciones: [Completar checklist preuso, Registrar movimiento, Reportar daño]
    alertas: [Habilitación de grúa vencida, Checklist preuso no realizado, Ruta bloqueada]
    notificaciones: Nueva tarea de traslado asignada.
    vacio: “No tiene tareas de traslado asignadas.”
    componentes: Tarjeta de habilitación con días restantes.
  medir:
    - [Incidentes, Incidentes SST del operador, hoy]
    - [Exactitud de movimientos, Movimientos registrados contra conteos (no existen), falta]
    - [Daños, Reportes de daño (no se registran), falta]
  flujo:
    entrada: Tareas de traslado desde bodega o despacho.
    procesa: Inspecciona el equipo y mueve cargas.
    salida: Movimientos registrados y checklist.
    destinatarios: Bodega, despacho, prevención.
    consecuencia: El inventario por ubicación queda actualizado.
  permisos: {equipos: "c@pr", inventario: "c,r@pr", rutinas: "c,r@pr", sst: "r@pr", ot: "c,cr@pr", habilitaciones: "c@pr"}
  apps: [desktop]
  validar: [Si las tareas de traslado se asignarán en SIMA o seguirán siendo verbales]
  hoy: Ajuste por cargo en Desktop (rutinas y seguridad). No hay tareas de traslado ni movimientos por ubicación.

- id: 15
  dashboard: Apoyo de línea
  proposito: Mantiene las estaciones abastecidas y ordenadas. Si se retrasa, la línea se detiene por falta de material.
  jornada:
    inicio: Revisa las solicitudes de reposición de las estaciones y la lista de tareas de limpieza y orden.
    durante: Abastece estaciones, separa material y limpia según procedimiento.
    coordina: Con operadores, líder de línea y bodega.
    anomalia: Si falta material en bodega, avisa al líder; si ve una condición insegura, la reporta.
    cierre: Confirma las reposiciones hechas y el checklist 5S.
  decide: Prioridad de reposición entre estaciones.
  escala: Líder de línea.
  consulta: [Solicitudes de reposición, Lista de tareas, Procedimientos de limpieza]
  genera:
    registrar: Reposiciones confirmadas y checklist 5S.
    crear: Reporte de condición insegura.
  no_ve: Información de otras personas, producción detallada de otras líneas, sueldos.
  impacto: Un faltante de material detiene la línea aunque las máquinas estén bien.
  ui:
    prioridad: Solicitudes de reposición pendientes.
    disposicion: Solicitudes por estación · tareas 5S · reporte rápido.
