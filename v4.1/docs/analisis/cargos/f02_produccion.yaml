    acciones: [Confirmar reposición, Completar 5S, Reportar condición insegura]
    alertas: [Estación sin material, Solicitud de reposición atrasada]
    notificaciones: Nueva solicitud de reposición.
    vacio: “No hay reposiciones pendientes.”
    componentes: Lista de solicitudes con tiempo de espera.
  medir:
