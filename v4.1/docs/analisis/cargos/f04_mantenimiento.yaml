- id: 29
  dashboard: Condición de activos
  proposito: Detecta la degradación antes de que se convierta en falla, mediante rutas de lubricación, muestreo e inspección de tendencias.
  jornada:
    inicio: Revisa su ruta del día y los equipos con tendencias de vibración o temperatura al alza.
    durante: Ejecuta la ruta, lubrica, toma muestras y registra hallazgos.
    coordina: Con mantenimiento (hallazgos), almacén (lubricantes) y laboratorio externo.
    anomalia: Si una tendencia supera el umbral de aviso, crea un aviso con evidencia para planificación.
    cierre: Registra la ruta completada y los hallazgos abiertos.
  decide: Si un hallazgo amerita una OT y con qué prioridad sugerida.
  escala: Planificador y jefatura de mantenimiento.
  consulta: [Rutas y puntos de inspección, Tendencias de vibración y temperatura, Historial de lubricación, Lubricantes disponibles]
  genera:
    registrar: Rutas ejecutadas, mediciones y hallazgos.
    crear: Avisos de degradación con evidencia.
  no_ve: Datos personales, sueldos. No cambia parámetros de máquina.
  impacto: Un hallazgo a tiempo convierte una falla con detención larga en una intervención programada.
  ui:
    prioridad: Equipos más cerca del límite y ruta del día.
    disposicion: Ranking de equipos por cercanía al límite · ruta del día · tendencias · hallazgos abiertos.
    menu: [Condición de activos, Rutas, Órdenes de trabajo, Explorador, Alertas, Reportar]
    datos: "Tablas: puntos de la ruta, hallazgos. Formularios: medición en punto, hallazgo con prioridad sugerida."
    acciones: [Ejecutar ruta, Registrar hallazgo, Crear aviso de degradación]
    alertas: [Vibración o temperatura sobre aviso, Ruta atrasada]
    notificaciones: Planificación programó una OT por su hallazgo.
    vacio: “No hay equipos con tendencias anormales.”
    componentes: Barras de cercanía al límite, gráfico de tendencia con umbrales.
  medir:
    - [Fallas por lubricación, "Causa de falla en intervenciones (texto libre, sin catálogo)", parcial]
    - [Adherencia a rutas, Rutinas ejecutadas a tiempo, hoy]
    - [Hallazgos resueltos, Avisos creados y su OT cerrada, parcial]
  flujo:
    entrada: Rutas, tendencias de sensores.
    procesa: Inspecciona y analiza tendencias.
    salida: Rutas cumplidas, hallazgos y avisos.
    destinatarios: Planificador, jefatura de mantenimiento.
    consecuencia: Se programan intervenciones antes de la falla.
