    acciones: [Emitir requerimiento, Marcar urgencia]
    alertas: [Material crítico sin cobertura, Entrega de proveedor atrasada]
    notificaciones: Bodega registró una recepción.
    vacio: “Sin faltantes para las órdenes programadas.”
    componentes: Tabla de necesidades netas con cobertura en días.
  medir:
