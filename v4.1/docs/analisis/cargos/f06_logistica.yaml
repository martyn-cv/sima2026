# Familia 6 · Planificación, abastecimiento y logística
- id: 36
  dashboard: Programa de producción
  proposito: Convierte pedidos y pronósticos en órdenes que la planta puede cumplir con su capacidad y sus materiales.
  jornada:
    inicio: Revisa pedidos nuevos y modificados, la carga por línea y el avance del programa de la semana.
    durante: Secuencia lotes, revisa restricciones (capacidad, materiales, mantenimiento) y emite órdenes de producción.
    coordina: Con comercial (fechas), operaciones, compras y bodega.
    anomalia: Si una línea se detiene o falta material, reprograma y comunica el impacto en fechas.
    cierre: Publica el programa actualizado.
  decide: Secuencia y fecha de las órdenes de producción.
  escala: Jefatura de producción y comercial (fechas no cumplibles).
  consulta: [Pedidos con fecha comprometida, Capacidad por línea, Disponibilidad de materiales, Órdenes en curso y su avance, Ventanas de mantenimiento]
  genera:
    crear: Órdenes de producción desde el programa.
    editar: Secuencia y fechas del programa.
    exportar: Plan maestro y semanal.
  no_ve: Datos personales, sueldos y contratos.
  impacto: Su programa decide qué se fabrica y cuándo; un programa infactible genera atrasos y sobretiempo.
  ui:
    prioridad: Pedidos en riesgo y carga por línea.
    disposicion: Carga por línea (semana) · pedidos por fecha · órdenes en curso · faltantes de material.
    menu: [Inicio, Programa, Pedidos, Capacidad, Órdenes de producción, Materiales]
    datos: "Tablas: pedidos, órdenes, carga. Formularios: orden de producción, reprogramación."
    acciones: [Crear orden desde pedido, Reprogramar, Exportar programa]
    alertas: [Pedido sin capacidad a tiempo, Material faltante para una orden, Línea detenida con órdenes programadas]
    notificaciones: Comercial registró un pedido; mantenimiento programó una detención.
    vacio: “No hay pedidos por programar.”
    componentes: Gantt por línea, barras de carga.
  medir:
    - [Adherencia al plan, Órdenes terminadas en su fecha, parcial]
    - [Atrasos, Órdenes vencidas, parcial]
    - [WIP, Inventario en proceso (no existe), falta]
    - [Utilización, Horas de producción contra disponibles, parcial]
  flujo:
    entrada: Pedidos, capacidad, materiales.
    procesa: Secuencia y verifica factibilidad.
    salida: Programa y órdenes de producción.
    destinatarios: Producción, MRP, compras, comercial.
    consecuencia: Las órdenes aparecen para la jefatura y los turnos.
