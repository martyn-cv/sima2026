- id: 37
  dashboard: Planificación de materiales
  proposito: Calcula cuánto material se necesita y cuándo, para que no falte ni sobre.
  jornada:
    inicio: Revisa faltantes para las órdenes de la semana y entregas atrasadas de proveedores.
    durante: Explota listas de materiales, compara con existencias y consumos, y genera requerimientos de compra.
    coordina: Con planificación, compras, bodega y producción.
    anomalia: Si un material crítico no llegará a tiempo, avisa a planificación para reprogramar.
    cierre: Deja los requerimientos emitidos y la lista de faltantes.
  decide: Cantidad y fecha de los requerimientos de material.
  escala: Compras (urgencias), planificación (reprogramar).
  consulta: [Listas de materiales, Existencias, Consumos, Plazos de proveedores, Órdenes programadas]
