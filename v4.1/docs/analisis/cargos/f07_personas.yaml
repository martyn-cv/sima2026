    durante: Registra altas, bajas y permisos, emite certificados y actualiza legajos.
    coordina: Con RR. HH., trabajadores y supervisores.
    anomalia: Si falta un documento obligatorio de un ingreso, lo bloquea como pendiente.
    cierre: Deja solicitudes resueltas.
  decide: Ninguna de fondo; registra según instrucción de RR. HH.
  escala: Jefatura de RR. HH.
