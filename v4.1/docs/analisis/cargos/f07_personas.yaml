    durante: Programa cursos, registra resultados y renueva habilitaciones.
    coordina: Con supervisores, prevención, calidad y mantenimiento.
    anomalia: Si una persona opera con una habilitación vencida, avisa a su jefatura para reasignarla.
    cierre: Actualiza la matriz de formación.
  decide: Programa de formación y registro de habilitaciones.
  escala: RR. HH. y jefaturas.
