# Familia 7 · Personas, relaciones laborales y servicios
# Esta familia maneja la información más protegida (hoja Permisos del Excel). Nada de su trabajo aparece en SIMA Desktop.
- id: 44
  dashboard: Personas
  proposito: Asegura que la planta tenga a las personas correctas, contratadas según la ley, formadas y con relaciones laborales sanas.
  jornada:
    inicio: Revisa contratos por vencer, altas y bajas en curso, ausentismo del mes y habilitaciones vencidas.
    durante: Aprueba contrataciones, firma desvinculaciones, revisa políticas y atiende casos escalados.
    coordina: Con gerencia, jefaturas, trabajadores y asesoría legal.
    anomalia: Ante un contrato vencido sin renovar o una cuenta activa de una persona desvinculada, corrige de inmediato.
    cierre: Revisa indicadores de dotación y rotación.
  decide: Contrataciones, desvinculaciones, renovaciones y políticas de personas; quién tiene cuenta SIMA y por qué canal.
  escala: Gerencia general y asesoría legal.
  consulta: [Dotación objetivo y actual por cargo, Contratos y vencimientos, Asistencia y ausentismo, Habilitaciones, Remuneraciones (consulta), Desvinculaciones, Cuentas SIMA]
  genera:
    crear: Fichas de trabajador, contratos y desvinculaciones.
    editar: Datos personales, cargos y dotación objetivo, cuentas SIMA.
    aprobar: Ingresos y salidas de personal.
    exportar: Informes de dotación.
  no_ve: Parámetros de PLC, OT técnicas, programas de máquina. Ve remuneraciones pero no las edita (las prepara el analista de remuneraciones).
  impacto: Si un contrato vence sin control, la cuenta se suspende y la persona no puede trabajar en SIMA. Una desvinculación mal registrada deja accesos abiertos.
  ui:
    prioridad: Contratos por vencer, brechas de dotación y documentos pendientes.
    disposicion: Franja (dotación, altas y bajas del mes, ausentismo, contratos por vencer) · vencimientos · brechas por cargo · habilitaciones vencidas.
    menu: [Inicio, Trabajadores, Contratos, Desvinculaciones, Cuentas de acceso, Asistencia, Habilitaciones, Cargos y dotación, Remuneraciones]
    datos: "Tablas: trabajadores, contratos, desvinculaciones. Formularios: ficha, contrato, término de contrato, cuenta."
    acciones: [Registrar ingreso, Renovar contrato, Registrar desvinculación, Revisar cuenta]
    alertas: [Contrato vence en 30 días, Cuenta activa de persona desvinculada, Brecha de dotación en cargo crítico]
    notificaciones: Reclutamiento cerró una vacante; una habilitación venció.
    vacio: “No hay vencimientos en los próximos 90 días.”
    componentes: Línea de vencimientos, organigrama, pirámide de dotación.
  medir:
    - [Rotación, Desvinculaciones y dotación, hoy]
    - [Cobertura de vacantes, Vacantes y fecha de cobertura (no existen), falta]
    - [Ausentismo, Asistencia mensual, hoy]
    - [Formación, Cursos y habilitaciones (solo habilitaciones), parcial]
  flujo:
    entrada: Solicitudes de jefaturas, procesos de selección, términos de contrato.
    procesa: Verifica normativa y aprueba.
    salida: Contratos, desvinculaciones, cuentas actualizadas.
    destinatarios: Jefaturas, remuneraciones, soporte TI, el trabajador.
    consecuencia: Al desvincular, la cuenta se cierra y la persona deja de aparecer en los equipos de las jefaturas.
  permisos: {personal: "c,cr,e,x@em", contratos: "c,cr,e@em", terminos: "c,cr,e@em", cuentas: "c,e@em", asistencia: "c@em", habilitaciones: "c,e@em", remuneraciones: "c@em", conceptos: "c@em", parametros: "c@em", seleccion: "c,ap@em", capacitacion: "c@em", casos: "c@em", sst: "c@ag", auditoria: "c@em", permisos: "c@em", kpis: "c@ag"}
  apps: [web]
  validar: [Si la jefatura de RR. HH. debe poder preparar remuneraciones (hoy sí) o solo consultarlas, Plazo de aviso para contratos por vencer]
  hoy: Fichas, contratos, desvinculaciones con cierre automático de cuenta, asistencia y habilitaciones. La web muestra además Planta, Mantenimiento y Eventos, que no corresponden a su trabajo.

- id: 45
  dashboard: Selección
  proposito: Cubre los puestos con personas aptas para las exigencias técnicas y de seguridad del cargo.
  jornada:
    inicio: Revisa vacantes abiertas, su antigüedad y las entrevistas del día.
    durante: Publica vacantes, entrevista, evalúa contra el perfil del cargo y verifica referencias.
    coordina: Con jefes solicitantes, RR. HH. y candidatos.
    anomalia: Si una vacante crítica supera el plazo, propone alternativas (reemplazo temporal, reasignación).
    cierre: Actualiza el estado de cada proceso.
  decide: Terna presentada al jefe solicitante.
  escala: Jefatura de RR. HH.
  consulta: [Vacantes y perfil del cargo (Excel), Dotación objetivo y brecha, Postulaciones y evaluaciones]
  genera:
    crear: Vacantes y procesos de selección.
    registrar: Entrevistas, evaluaciones y terna.
    editar: Datos de ingreso del seleccionado (alta inicial).
  no_ve: Remuneraciones de los trabajadores actuales, datos bancarios.
  impacto: Una vacante crítica sin cubrir obliga a sobretiempo o deja un equipo sin operador habilitado.
  ui:
    prioridad: Vacantes críticas y su antigüedad.
    disposicion: Vacantes por cargo con brecha · procesos en curso (embudo) · entrevistas del día.
    menu: [Inicio, Vacantes, Procesos, Cargos y perfiles, Ingresos]
    datos: "Tablas: vacantes, postulantes. Formularios: vacante, evaluación, alta inicial."
    acciones: [Abrir vacante, Registrar entrevista, Presentar terna]
    alertas: [Vacante crítica sobre 30 días]
    notificaciones: Jefe solicitante eligió candidato.
    vacio: “No hay vacantes abiertas. La brecha de dotación de cada cargo está en Cargos.”
    componentes: Embudo de selección.
  medir:
    - [Tiempo de cobertura, Fecha de apertura y de ingreso (no existen), falta]
    - [Permanencia inicial, Ingresos y desvinculaciones antes de 6 meses, hoy]
    - [Vacantes críticas, Brecha de dotación por cargo, hoy]
  flujo:
    entrada: Solicitud del jefe y perfil del cargo.
    procesa: Recluta y evalúa.
    salida: Terna y alta inicial.
    destinatarios: Jefe solicitante, RR. HH., remuneraciones.
    consecuencia: El nuevo trabajador entra con su cargo y su cuenta.
