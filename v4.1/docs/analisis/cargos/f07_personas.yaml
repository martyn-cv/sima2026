- id: 46
  dashboard: Remuneraciones y asistencia
  proposito: Calcula y prepara los pagos de cada período con asistencia conciliada y total confidencialidad.
  jornada:
    inicio: Revisa la asistencia cargada, horas extra y conceptos del período.
    durante: Concilia horas y ausencias, registra conceptos variables y prepara el cierre de remuneraciones.
    coordina: Con jefaturas (asistencia), finanzas (aprobación) y trabajadores.
    anomalia: Si una liquidación sale con valores anómalos, la corrige antes de enviar a aprobación.
    cierre: Envía el cierre a aprobación (no lo aprueba).
  decide: Contenido del cálculo dentro de los parámetros vigentes.
  escala: Finanzas (aprobación), RR. HH.
  consulta: [Contratos y sueldos base, Asistencia y horas, Conceptos variables, Parámetros legales]
  genera:
    registrar: Asistencia y conceptos variables.
    crear: Cierre preparado del período.
    exportar: Nómina y respaldos.
  no_ve: Información técnica de planta. No aprueba su propio cierre.
  impacto: Un error de cálculo afecta el pago de las personas; por eso el cierre requiere una segunda firma.
  ui:
    prioridad: Estado del período (preparado, aprobado) y diferencias.
    disposicion: Avance del período · diferencias de asistencia · conceptos · liquidaciones.
    menu: [Inicio, Asistencia, Conceptos, Remuneraciones, Parámetros]
    datos: "Tablas: liquidaciones, asistencia. Formularios: concepto variable, preparar cierre."
    acciones: [Preparar cierre, Registrar concepto, Exportar nómina]
    alertas: [Asistencia faltante, Cierre rechazado]
    notificaciones: Finanzas aprobó o rechazó el cierre.
    vacio: “El período no tiene asistencia cargada.”
    componentes: Etapas del cierre.
  medir:
    - [Exactitud de remuneraciones, Correcciones posteriores al pago (no existen), falta]
    - [Puntualidad, Fecha de aprobación del cierre, hoy]
    - [Errores, Cierres rechazados, hoy]
  flujo:
    entrada: Asistencia, contratos, conceptos.
    procesa: Calcula y concilia.
    salida: Cierre preparado.
    destinatarios: Finanzas y tesorería.
    consecuencia: Finanzas aprueba y tesorería paga.
