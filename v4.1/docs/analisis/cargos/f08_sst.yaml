  jornada:
    inicio: Revisa evaluaciones de puesto pendientes y medidas en curso.
    durante: Coordina controles de higiene y ergonomía con organismos externos.
    coordina: Con prevención, RR. HH., supervisión y prestadores.
    anomalia: Si un puesto presenta riesgo ergonómico, propone medidas.
    cierre: Registra el seguimiento sin datos clínicos.
