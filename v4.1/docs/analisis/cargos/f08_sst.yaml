# Familia 8 · Seguridad, salud y medioambiente
- id: 50
  dashboard: Prevención SST
  proposito: Asesora y verifica que los peligros estén controlados. Investiga cada evento para que no se repita.
  jornada:
    inicio: Revisa eventos reportados sin investigar, accidentes y casi accidentes recientes, y habilitaciones de seguridad vencidas.
    durante: Investiga eventos, hace inspecciones, actualiza la matriz de riesgos y verifica controles.
    coordina: Con todas las áreas, el organismo administrador y el comité paritario.
    anomalia: Ante un accidente, asegura la atención, registra el evento, activa la investigación y comunica a la gerencia.
    cierre: Actualiza acciones preventivas y su estado.
  decide: Investigación y cierre de eventos, controles requeridos, detención de una tarea insegura.
  escala: Gerencia de planta.
  consulta: [Eventos SST por tipo y área, Matriz de riesgos, Inspecciones, Habilitaciones de seguridad, Acciones preventivas]
  genera:
    registrar: Investigaciones, inspecciones y controles.
    aprobar: Cierre de eventos.
    editar: Matriz de riesgos y habilitaciones de seguridad.
    cerrar: Eventos con acciones verificadas.
  no_ve: Datos médicos individuales, sueldos, contratos.
  impacto: Un evento sin investigar se repite; un control no verificado expone a las personas.
  ui:
    prioridad: Eventos por investigar y accidentes.
    disposicion: Franja (eventos del mes, por investigar, días sin accidentes, acciones vencidas) · eventos · riesgos por zona · habilitaciones de seguridad.
    menu: [Prevención SST, Eventos, Investigaciones, Riesgos, Inspecciones, Habilitaciones, Explorador]
    datos: "Tablas: eventos, acciones. Formularios: investigación, inspección, acción preventiva."
    acciones: [Investigar evento, Registrar inspección, Cerrar evento]
    alertas: [Accidente, Evento sin investigar 48 horas, Habilitación de seguridad vencida]
    notificaciones: Nuevo evento reportado desde planta.
    vacio: “No hay eventos por investigar.”
    componentes: Mapa de calor de riesgos por zona, contador de días sin accidentes.
  medir:
    - [Controles cerrados, Acciones de eventos cerradas, parcial]
    - [Acciones preventivas, Acciones con plazo (no se registran por separado), parcial]
    - [Exposición a riesgos, Matriz de riesgos (no existe), falta]
  flujo:
    entrada: Reportes de todos los trabajadores.
    procesa: Investiga y define controles.
    salida: Eventos cerrados, matriz actualizada.
    destinatarios: Gerencia, jefaturas, comité.
    consecuencia: Cambian procedimientos y habilitaciones exigidas.
  permisos: {sst: "c,r,ap,ci,x@pl", riesgos: "c,cr,e@pl", habilitaciones: "c,e@pl", equipos: "c@pl", eventos: "c@pl", ot: "c@pl", emergencias: "c,e@pl", rutinas: "c@pl"}
  apps: [desktop, web]
  validar: [Si necesita SIMA Web además de Desktop para informes]
  hoy: Gestiona y cierra incidentes, edita habilitaciones. No hay matriz de riesgos ni inspecciones.

- id: 51
  dashboard: Comité paritario
  proposito: Representa la participación de trabajadores y empleador en la prevención.
  jornada:
    inicio: Revisa observaciones abiertas y medidas recomendadas.
    durante: Revisa condiciones, registra observaciones y participa en investigaciones.
    coordina: Con trabajadores, empleador, prevención y organismo administrador.
    anomalia: Si detecta un riesgo no resuelto, lo registra y hace seguimiento.
    cierre: Deja actas y seguimientos.
  decide: Recomendaciones del comité.
  escala: Prevención y gerencia.
  consulta: [Eventos SST (sin datos médicos), Observaciones, Medidas recomendadas]
  genera:
    registrar: Observaciones y actas.
    crear: Recomendaciones.
  no_ve: Datos personales y médicos, sueldos.
  impacto: Sus recomendaciones cierran riesgos que la operación no prioriza.
  ui:
    prioridad: Riesgos no resueltos.
    disposicion: Observaciones · recomendaciones con seguimiento · actas.
    menu: [Comité paritario, Observaciones, Recomendaciones, Eventos, Mi cargo]
    datos: "Formularios: observación, acta."
    acciones: [Registrar observación, Registrar acta]
    alertas: [Recomendación vencida]
    notificaciones: Prevención cerró una medida.
    vacio: “No hay observaciones abiertas.”
    componentes: Seguimiento de recomendaciones.
  medir:
    - [Recomendaciones cerradas, Recomendaciones (no existen), falta]
    - [Participación y cobertura, Actas e inspecciones (no existen), falta]
  flujo:
    entrada: Condiciones y eventos.
    procesa: Revisa y recomienda.
    salida: Actas y recomendaciones.
    destinatarios: Prevención y gerencia.
    consecuencia: Medidas preventivas.
  permisos: {sst: "c,r@pl", riesgos: "c,r@pl"}
