    durante: Controla la segregación de residuos, contratistas y consumos.
    coordina: Con planta, compras, mantenimiento, prevención y externos.
    anomalia: Ante un derrame o incidente ambiental, registra, contiene y notifica.
    cierre: Registra residuos generados y retirados.
