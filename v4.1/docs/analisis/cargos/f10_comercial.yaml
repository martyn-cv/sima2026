- id: 62
  dashboard: Servicio al cliente
  proposito: Responde al cliente con el estado real de su pedido y coordina cambios y devoluciones.
  jornada:
    inicio: Revisa consultas y solicitudes abiertas.
    durante: Registra pedidos, sigue su avance y gestiona devoluciones.
    coordina: Con comercial, planificación, calidad y despacho.
    anomalia: Si un pedido se atrasa, informa al cliente con la nueva fecha.
    cierre: Cierra solicitudes respondidas.
  decide: Respuesta al cliente según el estado registrado.
  escala: Comercial.
  consulta: [Pedidos y su estado, Despachos, Reclamos y devoluciones]
  genera:
    registrar: Pedidos, solicitudes y devoluciones.
    editar: Estado de la solicitud.
  no_ve: Costos, remuneraciones, datos personales.
  impacto: Una respuesta errónea al cliente daña la relación comercial.
  ui:
    prioridad: Solicitudes abiertas y pedidos atrasados.
    disposicion: Solicitudes · pedidos con estado · devoluciones.
