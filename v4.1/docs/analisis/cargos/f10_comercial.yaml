# Familia 10 · Comercial, cliente y diseño de producto
- id: 61
  dashboard: Comercial
  proposito: Convierte necesidades de clientes en pedidos rentables y compromisos que la planta pueda cumplir.
  jornada:
    inicio: Revisa pedidos en riesgo, reclamos abiertos y el forecast del mes.
    durante: Negocia precios y fechas, registra acuerdos y actualiza el forecast.
    coordina: Con clientes, planificación, finanzas y calidad.
    anomalia: Si un pedido no podrá cumplirse, negocia con el cliente antes de que venza.
    cierre: Actualiza la cartera.
  decide: Precios dentro de su banda autorizada y compromisos de fecha validados con planificación.
  escala: Gerencia general (precios fuera de banda).
  consulta: [Cartera y pedidos, Estado de producción y despacho de sus pedidos, Reclamos, Precios autorizados]
  genera:
    crear: Pedidos y acuerdos.
    editar: Forecast.
    registrar: Compromisos con clientes.
  no_ve: Costos detallados, remuneraciones, datos personales, información técnica de planta.
  impacto: Un compromiso no validado con planificación termina en atraso y reclamo.
  ui:
    prioridad: Pedidos en riesgo y reclamos.
    disposicion: Pedidos por estado · en riesgo · forecast vs. real · reclamos.
    menu: [Inicio, Pedidos, Clientes, Forecast, Reclamos, Despachos]
    datos: "Tablas: pedidos, clientes. Formularios: pedido, acuerdo, forecast."
    acciones: [Registrar pedido, Actualizar forecast, Ver estado del pedido]
    alertas: [Pedido en riesgo de atraso, Reclamo de cliente]
    notificaciones: Despacho entregó un pedido; calidad retuvo un lote de su pedido.
    vacio: “No hay pedidos registrados.”
    componentes: Seguimiento del pedido de punta a punta.
  medir:
    - [Ventas rentables, Ventas y costos (no existen), falta]
    - [Satisfacción, Encuestas o reclamos (no existen), falta]
    - [Exactitud forecast, Forecast y ventas reales (no existen), falta]
  flujo:
    entrada: Necesidades de clientes.
    procesa: Negocia.
    salida: Pedidos confirmados y forecast.
    destinatarios: Planificación, finanzas, despacho.
    consecuencia: Planificación programa la fabricación.
  permisos: {pedidos: "c,cr,e,x@em", despachos: "c@em", produccion: "c@ag", calidad: "c@em", kpis: "c@ag"}
