- id: 63
  dashboard: Ingeniería de producto
  proposito: Define qué se fabrica (planos, materiales, tolerancias) y controla cada cambio técnico.
  jornada:
    inicio: Revisa cambios de ingeniería en curso y consultas de producción o calidad.
    durante: Actualiza planos, BOM y especificaciones; gestiona prototipos.
    coordina: Con I+D, procesos, calidad, compras y producción.
    anomalia: Si un defecto proviene del diseño, abre un cambio controlado.
    cierre: Publica versiones aprobadas.
  decide: Contenido técnico del producto.
  escala: Gerencia (cambios mayores).
  consulta: [Especificaciones y versiones, BOM, Defectos de diseño, Materiales]
  genera:
    crear: Especificaciones, BOM y cambios de ingeniería.
    editar: Versiones.
    aprobar: Cambios técnicos (con calidad).
  no_ve: Costos detallados, remuneraciones, datos personales.
  impacto: Una versión equivocada en planta fabrica un producto que no corresponde.
  ui:
    prioridad: Cambios en curso.
    disposicion: Productos · cambios de ingeniería · versiones vigentes.
    menu: [Inicio, Productos, Cambios, Documentos]
    datos: "Tablas: productos con versión. Formularios: cambio de ingeniería."
    acciones: [Crear cambio, Publicar versión]
    alertas: [Cambio sin aprobación, Defecto de diseño reportado]
    notificaciones: Calidad aprobó un cambio.
    vacio: “No hay productos registrados.”
    componentes: Historial de versiones.
