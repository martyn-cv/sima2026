    acciones: [Registrar incidencia, Evaluar servicio]
    alertas: [Servicio crítico caído, Contratista sin acreditación]
    notificaciones: Nueva solicitud.
    vacio: “No hay solicitudes abiertas.”
    componentes: Lista de contratistas con acreditación.
  medir:
    - [Servicios disponibles, Incidencias de servicio (no existen), falta]
    - [Incidentes, Incidentes de contratistas (no existen), falta]
    - [Cumplimiento, Evaluaciones (no existen), falta]
  flujo:
