[package]
name = "sima-plc-simulator"
version = "4.1.0"
description = "SIMA PLC Simulator"
authors = ["Manufacturas Andina"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sima_plc_simulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
