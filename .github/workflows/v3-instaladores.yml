name: SIMA v3 · instaladores de escritorio
# Genera los instaladores de Windows (.msi y .exe), macOS y Linux del simulador de PLC y de la app de terreno.
# Se ejecuta a mano (Actions → Run workflow) o al publicar una etiqueta que empiece con «v3.».
on:
  workflow_dispatch:
  push:
    tags: ["v3.*"]

jobs:
  instaladores:
    name: ${{ matrix.app }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
        app: [plc-sim, terreno]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: v3/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - name: Bibliotecas de Tauri (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - name: Instalar dependencias
        working-directory: v3
        run: npm ci --no-audit --no-fund
      - name: Compilar la aplicación
        working-directory: v3/${{ matrix.app }}
        run: npm run tauri -- build
      - name: Guardar los instaladores
        uses: actions/upload-artifact@v4
        with:
          name: sima-${{ matrix.app }}-${{ matrix.os }}
          path: |
            v3/${{ matrix.app }}/src-tauri/target/release/bundle/msi/*.msi
            v3/${{ matrix.app }}/src-tauri/target/release/bundle/nsis/*.exe
            v3/${{ matrix.app }}/src-tauri/target/release/bundle/dmg/*.dmg
            v3/${{ matrix.app }}/src-tauri/target/release/bundle/deb/*.deb
            v3/${{ matrix.app }}/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
