# Render: "New > Blueprint" apuntando a este repositorio.
services:
  - type: web
    name: sima
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: sima-db, property: connectionString}
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DJANGO_HTTPS
        value: "1"
      - key: SIMA_PASSWORD_TECNICO
        sync: false
      - key: SIMA_PASSWORD_INGENIERO
        sync: false
      - key: SIMA_PASSWORD_OPERADOR
        sync: false
databases:
  - name: sima-db
    plan: free
